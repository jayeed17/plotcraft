[package]
name = "vizora"
version = "0.1.0"
description = "Vizora: open-source BI studio (desktop app)"
authors = ["Zayeed Bin Kabir"]
license = "MIT"
repository = "https://github.com/jayeed17/vizora"
edition = "2021"

[lib]
name = "vizora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
