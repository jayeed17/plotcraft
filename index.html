<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotcraft</title>
<meta name="description" content="Plotcraft is a free, open-source business intelligence studio that runs in your browser: drag-and-drop charts, calculated fields, joins and interactive dashboards. Your data never leaves your device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4' fill='%232b3bb8'/%3E%3Crect x='4' y='10' width='3' height='6' rx='1' fill='white'/%3E%3Crect x='8.5' y='6' width='3' height='10' rx='1' fill='white'/%3E%3Crect x='13' y='3.5' width='3' height='12.5' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-mode="sheet">
<div id="app">
  <header class="top">
    <h1 class="mark-word">
      <svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="4" fill="var(--accent)"/><rect x="4" y="10" width="3" height="6" rx="1" fill="var(--panel)"/><rect x="8.5" y="6" width="3" height="10" rx="1" fill="var(--panel)"/><rect x="13" y="3.5" width="3" height="12.5" rx="1" fill="var(--panel)"/></svg>
      Plotcraft
    </h1>
    <div class="dataset" id="datasetChip"><span>Loading…</span></div>
    <span class="spacer"></span>
    <div class="top-actions">
      <button class="btn primary" id="openDataBtn" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2.5 10.5v3h11v-3"/></svg>
        Open CSV or JSON
      </button>
      <button class="btn" id="projectBtn" type="button" aria-haspopup="menu">Project</button>
      <button class="btn quiet icon" id="themeBtn" type="button" aria-label="Switch light or dark theme" title="Switch light or dark theme">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg>
      </button>
      <a class="btn quiet" href="https://github.com/jayeed17/plotcraft" rel="noopener">GitHub</a>
    </div>
    <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.json,text/csv,application/json" hidden>
    <input type="file" id="wbInput" accept=".json,application/json" hidden>
    <input type="file" id="addTableInput" accept=".csv,.tsv,.txt,.json,text/csv,application/json" hidden>
  </header>

  <main class="work" id="workSheet">
    <aside class="pane pane-data" id="dataPane" aria-label="Data fields">
      <div class="pane-head">
        <div class="pane-title"><span class="label-caps">Data</span><button class="btn quiet small" id="newCalcBtn" type="button" title="New calculated field">+ Calculation</button></div>
        <input class="search" id="fieldSearch" type="search" placeholder="Search fields" aria-label="Search fields">
      </div>
      <div id="fieldList"></div>
      <p class="pane-foot">Drag a field onto a shelf, or click it to choose where it goes.</p>
    </aside>

    <aside class="pane pane-cards" aria-label="Filters and marks">
      <section class="card">
        <div class="card-head"><span class="label-caps">Filters</span></div>
        <div class="filters drop" data-shelf="filters" id="shelf-filters"></div>
      </section>
      <section class="card">
        <div class="card-head"><span class="label-caps">Marks</span></div>
        <select class="mark-select" id="markSelect" aria-label="Mark type"></select>
        <div class="channels">
          <div class="channel drop" data-shelf="color" id="shelf-color"></div>
          <div class="channel drop" data-shelf="size" id="shelf-size"></div>
          <div class="channel drop" data-shelf="label" id="shelf-label"></div>
          <div class="channel drop" data-shelf="detail" id="shelf-detail"></div>
        </div>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="shelves" id="shelvesBox">
        <div class="shelf">
          <span class="label-caps"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1v10M6 1v10M10 1v10" stroke="currentColor" stroke-width="1.5"/></svg>Columns</span>
          <div class="shelf-drop drop" data-shelf="cols" id="shelf-cols"></div>
        </div>
        <div class="shelf">
          <span class="label-caps"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h10M1 6h10M1 10h10" stroke="currentColor" stroke-width="1.5"/></svg>Rows</span>
          <div class="shelf-drop drop" data-shelf="rows" id="shelf-rows"></div>
        </div>
      </div>
      <div class="viewbar" id="viewbar">
        <input class="title-input" id="titleInput" aria-label="Sheet title">
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-view="chart" aria-pressed="true">Chart</button>
          <button type="button" data-view="data" aria-pressed="false">Data</button>
          <button type="button" data-view="sql" aria-pressed="false">SQL</button>
        </div>
        <div class="tools">
          <button class="btn quiet" id="swapBtn" type="button" title="Swap rows and columns">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 2v12M2 11l3 3 3-3M11 14V2M8 5l3-3 3 3"/></svg>Swap
          </button>
          <button class="btn quiet" id="clearBtn" type="button">Clear</button>
          <button class="btn quiet" id="exportBtn" type="button" aria-haspopup="menu" hidden>Export</button>
        </div>
      </div>
      <div class="viewport" id="viewport"><div id="chart"><div class="loading">Loading chart engine…</div></div></div>
    </section>
  </main>

  <section class="full" id="dashView" hidden>
    <div class="dash-bar">
      <input class="title-input" id="dashTitle" aria-label="Dashboard title">
      <span class="sel-note" id="selNote"></span>
      <div class="tools">
        <button class="btn" id="clearSelBtn" type="button" hidden>Clear selection</button>
        <button class="btn" id="addTileBtn" type="button" aria-haspopup="menu">Add</button>
        <button class="btn" id="editLayoutBtn" type="button">Edit layout</button>
      </div>
    </div>
    <div class="canvas" id="canvas"></div>
  </section>

  <section class="full" id="sourceView" hidden></section>

  <footer class="tabs" id="tabs" role="tablist" aria-label="Sheets and dashboards"></footer>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="dropzone" id="dropzone" hidden>Drop to open this file</div>

<script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
