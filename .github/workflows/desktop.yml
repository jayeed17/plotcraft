# Builds the Vizora desktop app for macOS, Windows and Linux and attaches the installers to a GitHub Release.
# Run it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) or from the Actions tab.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Vizora __VERSION__
          releaseBody: |
            Desktop builds of Vizora. Pick the file for your computer:

            - **Mac (Apple silicon, M1 and newer):** `Vizora_*_aarch64.dmg`
            - **Mac (Intel):** `Vizora_*_x64.dmg`
            - **Windows:** `Vizora_*_x64-setup.exe` (or the `.msi`)
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            These builds are not signed yet. On a Mac, right-click Vizora in Applications and choose **Open** the first time. On Windows, click **More info → Run anyway**.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
