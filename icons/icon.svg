<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2fb8"/>
      <stop offset=".5" stop-color="#3d3fe0"/>
      <stop offset="1" stop-color="#7a3cf5"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".1" r=".95">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff6ff"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4cf2cf" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4cf2cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <!-- ghost bar chart -->
  <rect x="196" y="520" width="132" height="300" rx="34" fill="url(#bar)"/>
  <rect x="446" y="640" width="132" height="180" rx="34" fill="url(#bar)"/>
  <rect x="696" y="400" width="132" height="420" rx="34" fill="url(#bar)"/>
  <!-- trend line forming a V -->
  <path d="M262 300 L512 700 L762 250" fill="none" stroke="#0b0f4d" stroke-opacity=".30" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 24)"/>
  <path d="M262 300 L512 700 L762 250" fill="none" stroke="url(#line)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="762" cy="250" r="160" fill="url(#halo)"/>
  <circle cx="762" cy="250" r="70" fill="#4cf2cf"/>
  <circle cx="762" cy="250" r="28" fill="#fff"/>
</svg>
